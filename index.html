  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

 0 auto; padding: 88px 24px; display: flex; flex-direction: column; align-items: center; gap: 44px\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; max-width: 660px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252; border: 1px solid #d4d4d4; border-radius: 999px; padding: 6px 14px\">The product<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 42px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; color: #0a0a0a\">See it in action<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #525252\">An OpenAI-compatible playground: pick a model, write the system instructions, attach tools, and chat with your assistant — all on your own server.<\u002Fp>\n<\u002Fdiv>\n<img src=\"3f4055a4-3c2a-44c8-82ce-c550da78703e\" alt=\"Agent Server — full playground screen\" style=\"width: 100%; border-radius: 16px; border: 1px solid #d4d4d4; box-shadow: 0 30px 80px rgba(0,0,0,.28); display: block\">\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tools\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 104px 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 680px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252\">TOOLS<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em\">One stack, from the API to the flow.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #525252\">Every piece is open source and deploys in minutes. Use them together or one at a time.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px\">\n<a href=\"https://github.com/moises-paschoalick/ai-agent-server\" style=\"text-decoration: none; color: #0a0a0a; background: #000000; border-radius: 14px; padding: 0; display: flex; flex-direction: column; gap: 0; min-height: 280px; overflow: hidden\">\n<div style=\"width: 100%; aspect-ratio: 16/10; overflow: hidden; border-bottom: 1px solid #262626\">\n<img src=\"e06cf3a6-9825-4407-99b1-b5ea909e9f37\" alt=\"Agent Server interface showing assistant configuration and chat\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block\">\n<\u002Fdiv>\n<div style=\"padding: 24px 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; color: #ffffff\">Agent Server<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #a3a3a3\">An OpenAI Assistants-compatible API you host. Threads, runs, server and client tools, any LLM.<\u002Fspan>\n<span style=\"margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #d4d4d4\">Java 21 · Spring Boot · LangChain4j<\u002Fspan>\n<\u002Fdiv>\n<\u002Fa>\n<a href=\"#\" style=\"text-decoration: none; color: #0a0a0a; border: 1px solid #d4d4d4; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px; min-height: 280px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"9\" width=\"7\" height=\"6\" rx=\"1.5\"><\u002Frect><rect x=\"15\" y=\"4\" width=\"7\" height=\"6\" rx=\"1.5\"><\u002Frect><rect x=\"15\" y=\"14\" width=\"7\" height=\"6\" rx=\"1.5\"><\u002Frect><path d=\"M9 12h3M12 7v10M12 7h3M12 17h3\"><\u002Fpath><\u002Fsvg>\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600\">Assistant nodes<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; border: 1px solid #0a0a0a; border-radius: 999px; padding: 3px 8px\">SOON<\u002Fspan><\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\">Drag an assistant into Node-RED. Threads, runs and polling handled for you, tool calls as a second output.<\u002Fspan>\n<span style=\"margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #525252\">node-red-contrib-agent-server<\u002Fspan>\n<\u002Fa>\n<a href=\"https://github.com/moises-paschoalick/node-red-mcp-server\" style=\"text-decoration: none; color: #0a0a0a; border: 1px solid #d4d4d4; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px; min-height: 280px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600\">MCP Tools<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\">Plug any Model Context Protocol server into Node-RED and call its tools in natural language. Local or remote.<\u002Fspan>\n<span style=\"margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #525252\">npm · node-red-contrib-mcp-tools<\u002Fspan>\n<\u002Fa>\n<a href=\"https://github.com/moises-paschoalick/node-red-railway-template\" style=\"text-decoration: none; color: #0a0a0a; border: 1px solid #d4d4d4; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px; min-height: 280px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2.1-.1-2.9a2.2 2.2 0 0 0-2.9-.1z\"><\u002Fpath><path d=\"M12 15l-3-3a22 22 0 0 1 2-3.9A12.9 12.9 0 0 1 22 2c0 2.7-.8 7.5-6 11a22.4 22.4 0 0 1-4 2z\"><\u002Fpath><path d=\"M9 12H4s.6-3 2-4c1.6-1.1 5 0 5 0M12 15v5s3-.6 4-2c1.1-1.6 0-5 0-5\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600\">Node-RED on Railway<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\">One-click Node-RED with a password-protected editor and persistent flows. The fastest way to start.<\u002Fspan>\n<span style=\"margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #525252\">Railway template · Docker<\u002Fspan>\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #fafafa; border-top: 1px solid #e5e5e5; border-bottom: 1px solid #e5e5e5\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 104px 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 680px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252\">HOW IT WORKS<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em\">From a message to an answer.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #525252\">The Agent Server keeps the conversation, picks the model and runs the tools. Your flow only sends the message and gets the reply.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n<div style=\"flex: 1 1 200px; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252\">01<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">A message arrives<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.55; color: #525252\">Telegram, WhatsApp, a web form or any HTTP call reaches your Node-RED or n8n flow.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: center; width: 24px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"flex: 1 1 200px; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252\">02<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">The assistant thinks<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.55; color: #525252\">The Agent Server loads the thread, applies the instructions and routes to the model you chose.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: center; width: 24px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"flex: 1 1 200px; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252\">03<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">Tools run<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.55; color: #525252\">Built-in tools run on the server. Yours (SQL, APIs, MCP) run in your flow and return their output.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: center; width: 24px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"flex: 1 1 200px; background: #000000; color: #ffffff; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #a3a3a3\">04<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">The answer goes back<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.55; color: #a3a3a3\">The reply is saved in the thread and sent to the user. Every step lands in the audit trail.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 32px; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 14px; padding: 32px\">\n<svg width=\"72\" height=\"80\" sc-camel-view-box=\"0 0 400 440\" role=\"img\" aria-label=\"Mascot waiting for a tool response\" style=\"flex-shrink: 0\">\n<path d=\"M106 150 V112 Q106 56 200 56 Q294 56 294 112 V150\" fill=\"none\" stroke=\"#247A6F\" stroke-width=\"12\" stroke-linecap=\"round\"><\u002Fpath>\n<rect x=\"162\" y=\"350\" width=\"30\" height=\"24\" rx=\"10\" fill=\"#2A9D8F\"><\u002Frect>\n<rect x=\"208\" y=\"350\" width=\"30\" height=\"24\" rx=\"10\" fill=\"#2A9D8F\"><\u002Frect>\n<path d=\"M152 292 Q122 306 110 328\" fill=\"none\" stroke=\"#3ECFB0\" stroke-width=\"18\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M248 290 Q282 300 300 282\" fill=\"none\" stroke=\"#3ECFB0\" stroke-width=\"18\" stroke-linecap=\"round\"><\u002Fpath>\n<rect x=\"184\" y=\"232\" width=\"32\" height=\"36\" rx=\"8\" fill=\"#2A9D8F\"><\u002Frect>\n<rect x=\"148\" y=\"260\" width=\"104\" height=\"98\" rx=\"26\" fill=\"#3ECFB0\"><\u002Frect>\n<rect x=\"170\" y=\"282\" width=\"60\" height=\"36\" rx=\"9\" fill=\"#0f2a27\"><\u002Frect>\n<rect x=\"179\" y=\"292\" width=\"42\" height=\"5\" rx=\"2.5\" fill=\"#3ECFB0\" opacity=\".7\"><\u002Frect>\n<rect x=\"179\" y=\"303\" width=\"28\" height=\"5\" rx=\"2.5\" fill=\"#3ECFB0\" opacity=\".45\"><\u002Frect>\n<rect x=\"112\" y=\"82\" width=\"176\" height=\"158\" rx=\"36\" fill=\"#3ECFB0\"><\u002Frect>\n<rect x=\"130\" y=\"108\" width=\"140\" height=\"104\" rx=\"22\" fill=\"#0f2a27\"><\u002Frect>\n<rect x=\"90\" y=\"132\" width=\"30\" height=\"58\" rx=\"12\" fill=\"#2A9D8F\"><\u002Frect>\n<rect x=\"280\" y=\"132\" width=\"30\" height=\"58\" rx=\"12\" fill=\"#2A9D8F\"><\u002Frect>\n<circle cx=\"172\" cy=\"156\" r=\"13\" fill=\"#ffffff\"><\u002Fcircle><circle cx=\"228\" cy=\"156\" r=\"13\" fill=\"#ffffff\"><\u002Fcircle>\n<circle cx=\"200\" cy=\"190\" r=\"6\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"5\"><\u002Fcircle>\n<circle cx=\"110\" cy=\"328\" r=\"12\" fill=\"#2A9D8F\"><\u002Fcircle>\n<circle cx=\"300\" cy=\"282\" r=\"12\" fill=\"#2A9D8F\"><\u002Fcircle>\n<circle cx=\"300\" cy=\"280\" r=\"22\" fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"4\" opacity=\".5\"><\u002Fcircle>\n<\u002Fsvg>\n<div style=\"display: flex; flex-direction: column; gap: 8px; flex: 1 1 0\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #0a0a0a\">See the full architecture<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.55; color: #525252\">How threads, runs and tool calls flow through the Agent Server — from the first message to the audit trail.<\u002Fspan>\n<\u002Fdiv>\n<a href=\"AgentServerFlow.dc.html\" style=\"font-weight: 600; font-size: 15px; padding: 12px 20px; border: 1px solid #d4d4d4; border-radius: 8px; text-decoration: none; color: #0a0a0a; white-space: nowrap\">Architecture →<\u002Fa>\n<a href=\"RunLifecycle.dc.html\" style=\"font-weight: 600; font-size: 15px; padding: 12px 20px; border: 1px solid #d4d4d4; border-radius: 8px; text-decoration: none; color: #0a0a0a; white-space: nowrap\">Run lifecycle →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section>\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 104px 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 680px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252\">AGENT SERVER<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em\">Built for production, not for demos.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1px; background: #e5e5e5; border: 1px solid #e5e5e5; border-radius: 14px; overflow: hidden\">\n<div style=\"background: #ffffff; padding: 32px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">OpenAI-compatible /v1<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\">Assistants, threads, messages and runs, checked field by field. Point the official SDK at your server.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 32px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">Any model, one string<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">provider:model<\u002Fspan> and aliases route to OpenAI, OpenRouter, Anthropic, Gemini, xAI or any compatible API.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 32px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">Server and client tools<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\">Date, time zones, Brazilian holidays and math run on the server. Your own tools come back as requires_action.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 32px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">PostgreSQL persistence<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\">Threads, runs and assistants survive redeploys. Flyway migrations, pgvector ready for RAG.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 32px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">Audit trail<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\">Latency, tokens and time to first token for every call, without storing message text or keys.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 32px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">Safe by default<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #525252\">API keys, one active run per thread, run expiry and recovery after a restart.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"recipes\" style=\"background: #000000; color: #ffffff\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 104px 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 640px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #a3a3a3\">RECIPES<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em\">Import a flow. Running in ten minutes.<\u002Fh2>\n<\u002Fdiv>\n<a href=\"#\" style=\"color: #ffffff; font-weight: 600; font-size: 15px; padding: 12px 0\">All recipes →<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n<a href=\"https://github.com/moises-paschoalick/ai-agent-server/tree/main/examples/node-red\" style=\"text-decoration: none; color: #ffffff; border: 1px solid #333333; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a3a3a3\">NODE-RED · TELEGRAM · POSTGRES<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600\">Book Keeper<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #a3a3a3\">A bookstore attendant on Telegram that searches the catalog with a get_books tool.<\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 600; color: #ffffff\">Import flow →<\u002Fspan>\n<\u002Fa>\n<a href=\"#\" style=\"text-decoration: none; color: #ffffff; border: 1px solid #333333; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a3a3a3\">N8N → NODE-RED<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600\">Automaster<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #a3a3a3\">The n8n flow that calls assistants, rebuilt in Node-RED with the Assistant nodes.<\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 600; color: #ffffff\">Coming soon<\u002Fspan>\n<\u002Fa>\n<a href=\"#\" style=\"text-decoration: none; color: #ffffff; border: 1px dashed #525252; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a3a3a3\">[CATEGORIA]<\u002Fspan>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600\">[PRÓXIMA RECEITA]<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #a3a3a3\">[Descrição em uma linha do problema que o flow resolve.]<\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 600; color: #ffffff\">Import flow →<\u002Fspan>\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"blog\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 104px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252\">BLOG<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em\">Notes from the build.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; border-top: 1px solid #e5e5e5\">\n<a href=\"https://medium.com/@moisescomp\" style=\"text-decoration: none; color: #0a0a0a; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding: 28px 0; border-bottom: 1px solid #e5e5e5\">\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600\">Running Node-RED in the cloud with MCP<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #525252\">Aug 2025 · Medium<\u002Fspan>\n<\u002Fa>\n<a href=\"#\" style=\"text-decoration: none; color: #0a0a0a; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; p
